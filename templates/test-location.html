<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Live Location Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #formContainer {
      position: absolute;
      top: 20px; left: 20px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="formContainer">
  <label>Ваша роль:
    <select id="role">
      <option value="user">User</option>
      <option value="driver">Driver</option>
    </select>
  </label><br><br>
  <label>Ваш ID: <input type="text" id="user_id" /></label><br><br>
  <button onclick="startTracking()">Старт</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let ws, myMarker, otherMarker, map;

    async function getPairId(user_id, role) {
        try {
            const response = await fetch(`http://127.0.0.1:8000/api/get-pair/?user_id=${user_id}&role=${role}`);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error("Ошибка при получении пары:", error);
            throw error;
        }
    }
  function redIcon() {
    return new L.Icon({
      iconUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-red.png",
      shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png",
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
  }

  async function reverseGeocode(lat, lon) {
    try {
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
      if (!resp.ok) throw new Error("Ошибка запроса");
      const data = await resp.json();
      return data.display_name || "Неизвестное место";
    } catch {
      return "Неизвестное место";
    }
  }

  async function startTracking() {
    const role = document.getElementById("role").value.trim();
    const user_id = document.getElementById("user_id").value.trim();

    if (!user_id) {
      alert("Введите ваш user_id");
      return;
    }

    const pair = await getPairId(user_id, role);
    const driver_id = pair.driver_id;
    const real_user_id = pair.user_id;

    if (!driver_id || !real_user_id) {
      alert("Не удалось получить вторую сторону пары");
      return;
    }

    document.getElementById("formContainer").style.display = "none";

    map = L.map("map").setView([42.8746, 74.6122], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    ws = new WebSocket(`ws://127.0.0.1:8000/ws/location/?user_id=${user_id}&driver_id=${driver_id}&role=${role}`);

    ws.onopen = () => {
      console.log("✅ WebSocket подключён");
      sendLocation();
      setInterval(sendLocation, 5000);
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      const coords = data.coordinates.map(Number);
      if (data.user_id !== user_id) {
        if (!otherMarker) {
          otherMarker = L.marker(coords, {icon: redIcon()}).addTo(map).bindPopup(`${data.role}<br>${data.location_text}`);
        } else {
          otherMarker.setLatLng(coords);
          otherMarker.getPopup().setContent(`${data.role}<br>${data.location_text}`);
        }

        if (myMarker && otherMarker) {
          const group = new L.featureGroup([myMarker, otherMarker]);
          map.fitBounds(group.getBounds().pad(0.5));
        }
      }
    };

    async function sendLocation() {
      if (!navigator.geolocation) {
        alert("Геолокация не поддерживается");
        return;
      }
      navigator.geolocation.getCurrentPosition(async pos => {
        const coords = [pos.coords.latitude, pos.coords.longitude];
        const location_text = await reverseGeocode(coords[0], coords[1]);
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            user_id: user_id,
            role: role,
            coordinates: coords,
            location_text: location_text
          }));
        }

        if (!myMarker) {
          myMarker = L.marker(coords).addTo(map).bindPopup("Вы<br>" + location_text).openPopup();
          map.panTo(coords);
        } else {
          myMarker.setLatLng(coords);
          myMarker.getPopup().setContent("Вы<br>" + location_text);
        }
      });
    }
  }
</script>

</body>
</html>
